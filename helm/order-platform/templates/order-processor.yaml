{{- $service := .Values.services.orderProcessor }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-platform.fullname" . }}-{{ $service.name }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  replicas: {{ $service.replicas | default .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "order-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $service.name }}
  template:
    metadata:
      labels:
        {{- include "order-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $service.name }}
    spec:
      automountServiceAccountToken: {{ $.Values.automountServiceAccountToken }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $service.name }}
          image: "{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml ($service.resources | default $.Values.resources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-platform.fullname" . }}-{{ $service.name }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "order-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
