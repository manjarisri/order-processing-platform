name: Order Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-api
          - order-processor
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt
          pip install pytest httpx

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        service:
          - order-api
          - order-processor
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ matrix.service }}:latest \
            services/${{ matrix.service }}